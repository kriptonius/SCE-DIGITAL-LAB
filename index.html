<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JUNTA ⚡ Organiza tus planes</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #131A24; color: #F3F4F6; margin: 0; padding: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    .container { width: 100%; max-width: 420px; }
    .header { text-align: center; margin-bottom: 24px; }
    .header h1 { font-size: 36px; font-weight: 900; margin: 0; color: #F3F4F6; }
    .header p { color: #9CA3AF; margin-top: 6px; font-size: 14px; }
    .card { background: #1F2733; padding: 20px; border-radius: 16px; margin-bottom: 16px; border: 1px solid #2D3748; }
    .card-title { font-size: 20px; font-weight: bold; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .info-row { margin-bottom: 8px; color: #9CA3AF; font-size: 15px; }
    .info-row strong { color: #F3F4F6; }
    .btn { display: flex; align-items: center; justify-content: center; width: 100%; padding: 16px; background: #8B5CF6; color: white; border: none; border-radius: 12px; font-weight: bold; text-decoration: none; font-size: 15px; cursor: pointer; text-align: center; transition: background 0.2s; }
    .btn:hover { background: #7C3AED; }
    .btn-secondary { background: #1F2733; color: #A78BFA; border: 1px solid #8B5CF6; margin-top: 10px; }
    .badge { background: #10B981; color: white; font-size: 11px; padding: 4px 8px; border-radius: 6px; font-weight: bold; text-transform: uppercase; }
    .loading { text-align: center; padding: 20px; color: #9CA3AF; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>JUNTA ⚡</h1>
      <p>Dejen el chat. Armen el plan.</p>
    </div>

    <!-- Contenedor dinámico de la Junta -->
    <div id="junta-card" class="card" style="display: none;">
      <div id="loading-state" class="loading">Cargando datos del evento...</div>
      
      <div id="content-state" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <span class="badge">Invitación</span>
          <span id="junta-codigo" style="font-family: monospace; color: #A78BFA; font-weight: bold;"></span>
        </div>
        <div id="junta-nombre" class="card-title"></div>
        <div class="info-row">📅 Fecha: <strong id="junta-fecha"></strong></div>
        <div class="info-row">🕐 Hora: <strong id="junta-hora"></strong></div>
        <div class="info-row">💰 Presupuesto: <strong id="junta-presupuesto"></strong></div>
        <div class="info-row">👑 Organiza: <strong id="junta-organiza"></strong></div>
        
        <a id="btn-app" href="#" class="btn" style="margin-top: 16px;">ABRIR EN LA APP Y CONFIRMAR</a>
      </div>
    </div>

    <!-- Sección de Descarga -->
    <div class="card" style="text-align: center;">
      <h3 style="margin-top: 0;">Obtener App Junta</h3>
      <p style="color: #9CA3AF; font-size: 14px; margin-bottom: 16px;">Instala la aplicación para Android para crear tus propias juntas y confirmar asistencia.</p>
      <a href="./app-release.apk" class="btn btn-secondary">Descargar APK v1.8.0</a>
    </div>
  </div>

  <script>
    // Coloca el ID exacto de tu proyecto de Firebase
    const FIREBASE_PROJECT_ID = "TU_FIREBASE_PROJECT_ID"; 

    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');

    if (code) {
      const juntaCard = document.getElementById('junta-card');
      const loadingState = document.getElementById('loading-state');
      const contentState = document.getElementById('content-state');
      
      juntaCard.style.display = 'block';

      // Consulta a Firestore usando la API REST pública
      fetch(`https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}/databases/(default)/documents:runQuery`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          structuredQuery: {
            from: [{ collectionId: 'juntas' }],
            where: {
              fieldFilter: {
                field: { fieldPath: 'codigo' },
                op: 'EQUAL',
                value: { stringValue: code.toUpperCase() }
              }
            },
            limit: 1
          }
        })
      })
      .then(res => res.json())
      .then(data => {
        loadingState.style.display = 'none';

        if (data && data[0] && data[0].document) {
          const fields = data[0].document.fields;
          
          document.getElementById('junta-codigo').innerText = fields.codigo?.stringValue || code;
          document.getElementById('junta-nombre').innerText = `${fields.emoji?.stringValue || '🎉'} ${fields.nombre?.stringValue || 'Junta'}`;
          document.getElementById('junta-fecha').innerText = fields.fecha?.stringValue || 'Por definir';
          document.getElementById('junta-hora').innerText = fields.hora?.stringValue || 'Por definir';
          document.getElementById('junta-presupuesto').innerText = `S/${fields.presMin?.integerValue || 0} - S/${fields.presMax?.integerValue || 0}`;
          document.getElementById('junta-organiza').innerText = fields.creadorNombre?.stringValue || fields.creador?.stringValue || 'Amigo';

          contentState.style.display = 'block';
        } else {
          loadingState.innerText = "❌ No se encontró la junta especificada o ya expiró.";
          loadingState.style.display = 'block';
        }
      })
      .catch(err => {
        console.error(err);
        loadingState.innerText = "Error al obtener los detalles del evento.";
        loadingState.style.display = 'block';
      });
    }
  </script>
</body>
</html>
